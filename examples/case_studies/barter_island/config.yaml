# Barter Island case study with the PUBLISHED parameter set (coupled calibration trial 88, which contains the thermal
# calibration trial 869). Source: coupled_calibration_runs/20260214_calibration_runs/optuna_trial_000088/config.yaml.
# The solver options below are set to their legacy (v1.0) values; the flux and volumetric alternatives are listed with each option.
# Run time: the 10-year spin-up of the thermal module dominates. To skip it in repeated runs, save the state once with
# model.spinup_state_out and load it with model.spinup_state_in (see below).

# data parameters
data:
  forcing_data_path : 'examples/case_studies/barter_island/database/era5.csv'
  storm_data_path   : 'examples/case_studies/barter_island/database/storms.csv'

  # v1.1 option. ERA5 'mean_surface_*' fluxes are means over the hour ENDING at the time label.
  # 0 = no shift (each row is applied over the hour that follows its label, v1.0);  1 = shift the three flux columns back one hour,
  # to the start of the averaging hour.
  era5_flux_shift_hours : 0

# model settings
model:
  longitude         : -143.7  # longitude of the study site
  latitude          : 70.13  # latitude of the study site
  time_start        : '01-01-2002' # DD-MM-YY starting time (if -1 take entire dataset). Published run. Short test: '01-07-2015' with spin_up_time 0
  time_end          : '01-01-2016'  # DD-MM-YY stopping time (if -1 take entire dataset)
  timestep          : 1  # size of timesteps (in hours)
  call_xbeach_inter : 168  #  xbeach is called during inter-storm periods every X (wrapper) timesteps (default: 168, i.e. 1 week)
  time_zone_diff    : -8  # [hours] relative difference in hours with respect to UTC. For Alaska equals -8.
  spin_up_time      : 10  # [years] spin up time of the thermal module, during which no morphological update is performed

  # v1.1 options: save / reuse the thermal state at the end of the spin-up (default None = off). XBeach does not run during the
  # spin-up, so the state is the thermal state on the unchanged initial bathymetry. A restart refuses to load if the thermal
  # config, start time, spin-up length, timestep, forcing or initial grid differ from those the state was made with.
  # Relative paths are relative to this folder.
  # spinup_state_out : spinup_state.npz   # write the state when the spin-up has finished
  # spinup_state_in  : spinup_state.npz   # skip the spin-up and continue from this state

# wrapper parameters:
wrapper:
  sea_ice_threshold     : 0.85  # Only run xbeach if sea ice fraction is below threshold, otherwise assume all wave action attenuated
  xb_threshold          : 2.012924093703792   # [m + MSL] threshold value for total water level + R2% (calibrated)
  CFL_thermal           : 0.5   # maximum CFL for thermal module
  CFL_xbeach            : 0.7   # maximum CFL for XBeach module

# bathymetry parameters
bathymetry:
  xfile           : 'x.grd'   # file used for the grid (x-direction)
  depfile         : 'bed.dep'  # file used for the bed
  grid_orientation: 88.14  # [degrees], orientation of bluff face with respect to east (ccw). The current orientation is calculated in the 'generate_bathymetry.ipynb' notebook
  ppwl            : 40  # number of points in the grid per wavelength. Default 20.
  nx              : 3   # number of points in initial grid. Set to 'None' if this should be based on ppwl.
  with_nx         : False  # whether or not to use the number of points specified with nx

  # schematized bathymetry parameters
  with_schematized_bathymetry : True  # whether or not to generate a schematized bathymetry upon initialization
  bluff_flat_length           : 100  # [m] length of the flat attached to the crest of the bluff
  bluff_height                : 12  # [m] height of the bluff
  bluff_slope                 : 1  # [-] slope of the bluff, i.e., height/width
  beach_width                 : 12.5  # [m] width of the beach
  beach_slope                 : 0.1  # [-] slope of the beach, i.e., height/width
  nearshore_max_depth         : 3  # [m] maximum depth of the nearshore
  nearshore_slope             : 0.03  # [-] slope of the nearshore section, i.e., height/width
  offshore_max_depth          : 5  # [m] maximum offshore depth
  offshore_slope              : 0.007  # [-] slope of the offshore section, i.e., height/width
  continental_flat_width      : 400  # [m] width of the continental flat section
  with_artificial             : True  # whether or not to extend to bathymetry with an artificial depth increase (if required by xbeach)
  artificial_max_depth        : 10  # [m] maximum depth of the artificial section (wave heights in dataset are defined at a depth of 10m, so that value is recommended)
  artificial_slope            : 0.02  # [-] slope of the artificial section, i.e., height/width
  N                           : 100 # number of points of each section
  artificial_flat             : 60  # [m] length of flat section at the end of artificial slope

# xbeach parameters
xbeach:

  # general settings
  with_xbeach : True  # include the xbeach module in the model, default true
  version     : d:\software\XBeach\releases\halloween\XBeach_1.24.6057_Halloween_win64_netcdf\xbeach.exe  # path to the XBeach executable (published runs: XBeach 1.24.6057 Halloween, win64 netcdf)

  # physical processes:
  with_wind     : False  # include wind in the xbeach model
  with_ne_layer : True  # if True include 'struct' (and thereby ne_layer) in XBeach computation

  # grid settings
  thetamin  : 0  # minimum angle
  thetamax  : 360  # maximum angle
  dtheta    : 360  # bin width
  thetanaut : 1 # for coordinate system

  # hydrodynamics settings
  wbctype : 'jons'   # type of wave boundary condition
  bcfile  : 'jonswap.txt'  # file containing the bc specifications
  rho_sea_water : 1025  # [kg/m3] density (sea) water

  # sediment properties (calibrated: bedfriccoef, dryslp, wetslp)
  dryslp      : 0.5578092253749002  # [dz/dx] Critical avalanching slope above water (dz/dx and dz/dy)
  wetslp      : 0.15233427680340267  # [dz/dx] Critical avalanching slope below water (dz/dx and dz/dy)
  D50         : 0.000036  # [m] mean grain size, value from Nando (personal communication)
  rho_solid   : 2650  # [kg/m3] density of sediment particles
  bedfriccoef : 0.033501187112818874  # [-] bed friction coefficient

  # morphological parameters
  lsgrad : 0.0  # [1/m] Factor to include longshore transport gradient in 1d simulations; dsy/dy=lsgrad*sy; dimension 1/length scale of longshore gradients

  # wave asymmetry factors (calibrated, one value for all three)
  facSk: 0.018829910025755153  # [-] Calibration factor time averaged flows due to wave skewness. Default is 0.15.
  facAs: 0.018829910025755153  # [-] Calibration factor time averaged flows due to wave asymmetry. Default is 0.20.
  facua: 0.018829910025755153  # [-] Calibration factor time averaged flows due to wave skewness and asymmetry. Default is 0.175.

# thermal model parameters (calibrated against the borehole temperatures, thermal trial 869; frozen in the coupled calibration)
thermal:
  L_water_ice: 334000  # [J/kg] latent heat of fusion of water
  MSL: 0
  N_thaw_threshold: 3
  T_melt: 273.15
  angle_max: 89
  angle_min: -89
  c_soil_frozen: 1574265.3175829535  # [J/m3/K] volumetric heat capacity, frozen
  c_soil_unfrozen: 3103885.0192965684  # [J/m3/K] volumetric heat capacity, unfrozen
  delta_angle: 1
  depth_constant_k: 1.395528377852392  # [m] depth at which k reaches its maximum
  dt: 120  # [s] thermal time step
  geothermal_gradient: 0.020426871031478094  # [K/m]
  grid_interpolation: linear_interp_z
  grid_resolution: 200
  hc_guess: 500
  k_soil_frozen_max: 1.7305832283149918  # [W/m/K]
  k_soil_frozen_min: 0.9046457783637623
  k_soil_unfrozen_max: 0.6305668303224798
  k_soil_unfrozen_min: 0.3296227605203751
  max_depth: 10  # [m]
  nb_max: 0.7101082595355153  # [-] porosity (ice content) near the surface
  nb_max_depth: 0.41887032171820293  # [m]
  nb_min: 0.46951231603096133  # [-] porosity (ice content) at depth
  nb_min_depth: 2.372186433986581  # [m]
  rho_ice: 917
  rho_particle: 2650
  rho_soil: None
  rho_water: 1000
  surface_flux_angle: 90
  surface_flux_factor: 1
  t_end: '2017-01-01'
  t_start: '2016-01-01'
  with_convective_transport_water_guess: true
  with_latent: true
  with_longwave: true
  with_solar: true
  with_solar_flux_calculator: true

  # v1.1 solver options. The values below are the v1.0 (legacy) ones.
  # Alternatives are  conduction_form: flux  and  latent_heat_form: volumetric  (the thermal parameters are calibrated per option set).
  conduction_form  : nodal     # nodal: k * d2T/dz2 with nodal k (v1.0, not conservative for k(z, phase)) | flux: conservative finite-volume form with harmonic-mean k at the cell faces
  latent_heat_form : per_mass  # per_mass: L*nb per kg of soil (v1.0; volumetric latent heat rho_soil*L*nb) | volumetric: L*nb*rho_water/rho_soil

# output
output:
  output_res              : 1  # temporal resolution of output variables in hours (i.e., model outputs given variable names every X hours)
  use_default_output_path : True  # If True, the model creates a subfolder in the same folder as the configuration file, and stores all results there. If False, the output_path variable is used and a subfolder with the run_id is created at this location
  output_path             : "P:/11210070-usgscoop-202324-arcticxb/runs/"  # "P:/11210070-usgscoop-202324-arcticxb/runs/" (absolute path to p-drive)
  save_ground_temp_layers: [0, 0.5, 1.0, 2.0, 2.95]  # [m] depths at which ground temperature is written seperately to csv file
  heat_fluxes: ['total_heat_flux[W/m2]', 'long_wave_radiation_flux[W/m2]', 'solar_radiation_flux[W/m2]', 'latent_heat_flux[W/m2]', 'convective_heat_flux[W/m2]']    # define heat fluxes to be used in memory output

  # v1.1 run diagnostics (read-only, do not change results), written to the result folder and summarised at the end of run.log
  log_xbeach_calls : True  # xbeach_calls.csv: one row per XBeach call (time, reason storm|inter|both, hotstart, wall-clock of XBeach and grid update)
  log_conservation : True  # conservation_log.csv: stored heat before/after each regrid (material vs interpolation error) and sediment budget
